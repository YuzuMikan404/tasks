name: Update from upstream and release Windows

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/upstream-auto-release.yml"
      - "scripts/prepare_upstream_release.sh"
      - "scripts/promote_windows_release.sh"
      - "scripts/report_upstream_failure.sh"
      - "scripts/resolve_upstream_conflicts.py"
      - "scripts/test_resolve_upstream_conflicts.py"
      - "scripts/test_release_workflow.py"
      - "scripts/verify_windows_fork_patches.py"
  schedule:
    # 12:17 JST every day. Windows starts only for a missing release.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-windows-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare isolated upstream candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      needs_update: ${{ steps.candidate.outputs.needs_update }}
      version: ${{ steps.candidate.outputs.version }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare_upstream_release.sh

  maintenance:
    name: Normalize existing Windows release
    needs: prepare
    if: ${{ needs.prepare.outputs.needs_update == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - name: Normalize release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/promote_windows_release.sh --normalize-only

  windows:
    name: Test and build isolated Windows candidate
    needs: prepare
    if: ${{ needs.prepare.outputs.needs_update == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_branch }}

      - name: Verify candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v5

      - name: Verify Windows-fork patches
        run: python scripts/verify_windows_fork_patches.py

      - name: Test desktop
        run: .\gradlew.bat :composeApp:desktopTest --console=plain

      - name: Build Windows MSI
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: .\gradlew.bat :composeApp:packageMsi -Prelease --console=plain

      - name: Prepare release files
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi/*.msi" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw "The Windows MSI was not generated."
          }
          New-Item -ItemType Directory -Force "release-files" | Out-Null
          $releaseMsi = "release-files/tasks-org-windows-x64-$env:VERSION.msi"
          Copy-Item $msi.FullName $releaseMsi
          $hash = (Get-FileHash $releaseMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($releaseMsi))" |
            Set-Content "release-files/tasks-org-windows-x64-$env:VERSION.sha256"

      - name: Upload validated release candidate
        uses: actions/upload-artifact@v7
        with:
          name: tasks-org-windows-${{ needs.prepare.outputs.version }}
          path: release-files/*
          if-no-files-found: error

      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-report-${{ needs.prepare.outputs.version }}
          path: composeApp/build/reports/tests/desktopTest/
          if-no-files-found: warn

  publish:
    name: Atomically promote and publish candidate
    needs:
      - prepare
      - windows
    if: ${{ needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: tasks-org-windows-${{ needs.prepare.outputs.version }}
          path: release-files

      - name: Promote and publish validated candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_BASE: ${{ needs.prepare.outputs.base_sha }}
          EXPECTED_CANDIDATE: ${{ needs.prepare.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ needs.prepare.outputs.candidate_branch }}
        run: bash scripts/promote_windows_release.sh

  report:
    name: Report automatic update failure
    needs:
      - prepare
      - maintenance
      - windows
      - publish
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.maintenance.result == 'failure' || needs.windows.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - name: Create or update failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MAINTENANCE_RESULT: ${{ needs.maintenance.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: bash scripts/report_upstream_failure.sh
