name: Update from upstream and release Windows

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/upstream-auto-release.yml"
  schedule:
    # 12:17 JST every day. The Windows runner starts only for a new release.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-windows-release
  cancel-in-progress: false

jobs:
  update:
    name: Check official Tasks.org release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
      sha: ${{ steps.update.outputs.sha }}

    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge latest official release
        id: update
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/tasks/tasks.git
          latest="$(
            git ls-remote --tags --refs upstream |
              sed 's#.*refs/tags/##' |
              grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' |
              sort -V |
              tail -n 1
          )"
          current="$(tr -d '[:space:]' < .github/upstream-version)"

          if [ -z "$latest" ]; then
            echo "No official numeric release tag was found."
            exit 1
          fi

          echo "Latest official release: $latest"
          echo "Current fork release: $current"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

          if [ "$latest" = "$current" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fork_head="$(git rev-parse HEAD)"
          git fetch upstream "refs/tags/$latest:refs/tags/upstream-$latest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "refs/tags/upstream-$latest"

          # Never import upstream Actions definitions. This fork publishes Windows only.
          git checkout "$fork_head" -- .github/workflows
          git rm -f --ignore-unmatch \
            .github/workflows/bundle.yml \
            .github/workflows/release.yml \
            .github/workflows/deploy.yml

          # Fail safely if an upstream merge removed any required fork patch.
          grep -Fq 'isLibre = true' \
            composeApp/src/desktopMain/kotlin/org/tasks/di/DesktopModule.kt
          grep -Fq 'platformConfiguration.isLibre' \
            composeApp/src/commonMain/kotlin/org/tasks/di/CommonModule.kt
          grep -Fq 'icon = painterResource(Res.drawable.ic_round_icon)' \
            composeApp/src/desktopMain/kotlin/main.kt
          grep -Fq 'iconFile.set(project.file("../graphics/icon.ico"))' \
            composeApp/build.gradle.kts
          test -f graphics/icon.ico

          printf '%s\n' "$latest" > .github/upstream-version
          git add .github/upstream-version
          if ! git diff --cached --quiet; then
            git commit -m "Track upstream Tasks.org $latest"
          fi

          git push origin HEAD:main
          new_sha="$(git rev-parse HEAD)"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

  windows:
    name: Build and publish Windows release
    needs: update
    if: ${{ needs.update.outputs.updated == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out updated fork
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test desktop entitlement policy
        run: .\gradlew.bat :composeApp:desktopTest --console=plain

      - name: Build Windows MSI
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: .\gradlew.bat :composeApp:packageMsi -Prelease --console=plain

      - name: Prepare Windows release files
        id: files
        shell: pwsh
        env:
          VERSION: ${{ needs.update.outputs.version }}
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi/*.msi" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw "The Windows MSI was not generated."
          }

          New-Item -ItemType Directory -Force "release-files" | Out-Null
          $releaseMsi = "release-files/tasks-org-windows-x64-$env:VERSION.msi"
          Copy-Item $msi.FullName $releaseMsi
          $hash = (Get-FileHash $releaseMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($releaseMsi))" |
            Set-Content "release-files/tasks-org-windows-x64-$env:VERSION.sha256"

          "msi=$releaseMsi" >> $env:GITHUB_OUTPUT
          "sha256=release-files/tasks-org-windows-x64-$env:VERSION.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasks-org-windows-${{ needs.update.outputs.version }}
          path: release-files/*
          if-no-files-found: error

      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-report-${{ needs.update.outputs.version }}
          path: composeApp/build/reports/tests/desktopTest/
          if-no-files-found: warn

      - name: Create Windows-only GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.update.outputs.version }}
          TARGET_SHA: ${{ needs.update.outputs.sha }}
          MSI: ${{ steps.files.outputs.msi }}
          SHA256_FILE: ${{ steps.files.outputs.sha256 }}
        run: |
          $tag = "windows-v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:MSI $env:SHA256_FILE --clobber
            exit $LASTEXITCODE
          }

          gh release create $tag $env:MSI $env:SHA256_FILE `
            --target $env:TARGET_SHA `
            --title "Tasks.org Windows $env:VERSION" `
            --notes "Windows-only libre build based on the official Tasks.org $env:VERSION release. EteSync and self-hosted CalDAV synchronization do not require a Tasks.org subscription." `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the GitHub Release."
          }
