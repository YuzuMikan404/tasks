name: Desktop build and release

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example windows-v15.8.0. Leave blank to build only."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Test and build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test desktop entitlement policy
        run: .\gradlew.bat :composeApp:desktopTest --console=plain

      - name: Build Windows MSI
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: .\gradlew.bat :composeApp:packageMsi -Prelease --console=plain

      - name: Prepare release files
        id: files
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi/*.msi" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw "The Windows MSI was not generated."
          }

          New-Item -ItemType Directory -Force "release-files" | Out-Null
          $label = if ($env:RELEASE_TAG) {
            $env:RELEASE_TAG -replace "^windows-v", ""
          } else {
            $env:GITHUB_SHA.Substring(0, 9)
          }
          $safeLabel = $label -replace "[^A-Za-z0-9._-]", "-"
          $releaseMsi = "release-files/tasks-org-windows-x64-$safeLabel.msi"
          Copy-Item $msi.FullName $releaseMsi

          $hash = (Get-FileHash $releaseMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($releaseMsi))" |
            Set-Content "release-files/tasks-org-windows-x64-$safeLabel.sha256"

          "msi=$releaseMsi" >> $env:GITHUB_OUTPUT
          "sha256=release-files/tasks-org-windows-x64-$safeLabel.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasks-org-windows-${{ github.sha }}
          path: release-files/*
          if-no-files-found: error

      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-report-${{ github.sha }}
          path: composeApp/build/reports/tests/desktopTest/
          if-no-files-found: warn

  linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Linux DEB
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: ./gradlew :composeApp:packageDeb -Prelease --console=plain

      - name: Prepare release files
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          deb="$(find composeApp/build/compose/binaries/main/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb" || { echo "The Linux DEB was not generated."; exit 1; }

          mkdir -p release-files
          if [ -n "$RELEASE_TAG" ]; then
            label="${RELEASE_TAG#windows-v}"
          else
            label="${GITHUB_SHA:0:9}"
          fi
          safe_label="$(printf '%s' "$label" | sed 's/[^A-Za-z0-9._-]/-/g')"
          release_deb="release-files/tasks-org-linux-x64-$safe_label.deb"
          cp "$deb" "$release_deb"
          sha256sum "$release_deb" > "release-files/tasks-org-linux-x64-$safe_label.sha256"

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasks-org-linux-${{ github.sha }}
          path: release-files/*
          if-no-files-found: error

  publish:
    name: Create desktop GitHub Release
    needs:
      - windows
      - linux
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download desktop build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tasks-org-*-${{ github.sha }}
          path: release-files
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          PRERELEASE: ${{ github.ref_type == 'tag' || inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
            exit
          fi

          args=(
            "$RELEASE_TAG" release-files/*
            --target "$GITHUB_SHA"
            --title "Tasks.org Desktop ${RELEASE_TAG#windows-v}"
            --notes "Windows and Linux desktop builds based on the official Tasks.org release, with the desktop generic entitlement enabled."
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
