name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example windows-v15.8.0. Leave blank to build only."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Test and build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test desktop entitlement policy
        run: .\gradlew.bat :composeApp:desktopTest --console=plain

      - name: Build Windows MSI
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: .\gradlew.bat :composeApp:packageMsi -Prelease --console=plain

      - name: Prepare release files
        id: files
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi/*.msi" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw "The Windows MSI was not generated."
          }

          New-Item -ItemType Directory -Force "release-files" | Out-Null
          $label = if ($env:RELEASE_TAG) {
            $env:RELEASE_TAG
          } else {
            $env:GITHUB_SHA.Substring(0, 9)
          }
          $safeLabel = $label -replace "[^A-Za-z0-9._-]", "-"
          $releaseMsi = "release-files/tasks-org-windows-x64-$safeLabel.msi"
          Copy-Item $msi.FullName $releaseMsi

          $hash = (Get-FileHash $releaseMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($releaseMsi))" |
            Set-Content "release-files/tasks-org-windows-x64-$safeLabel.sha256"

          "msi=$releaseMsi" >> $env:GITHUB_OUTPUT
          "sha256=release-files/tasks-org-windows-x64-$safeLabel.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasks-org-windows-${{ github.sha }}
          path: release-files/*
          if-no-files-found: error

      - name: Upload desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-report-${{ github.sha }}
          path: composeApp/build/reports/tests/desktopTest/
          if-no-files-found: warn

      - name: Create Windows-only GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          PRERELEASE: ${{ github.ref_type == 'tag' || inputs.prerelease }}
          MSI: ${{ steps.files.outputs.msi }}
          SHA256_FILE: ${{ steps.files.outputs.sha256 }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:MSI $env:SHA256_FILE --clobber
            exit $LASTEXITCODE
          }

          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            $env:MSI, $env:SHA256_FILE,
            "--target", $env:GITHUB_SHA,
            "--title", "Tasks.org Windows $env:RELEASE_TAG",
            "--notes", "Windows-only libre build. EteSync and self-hosted CalDAV synchronization do not require a Tasks.org subscription."
          )
          if ($env:PRERELEASE -eq "true") {
            $arguments += "--prerelease"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the GitHub Release."
          }
